[project]
name = "newsgator-backend"
version = "0.1.0"
description = "NewsGator backend — self-hosted AI news clustering reader"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",  # form/file uploads (OPML import)
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "robotspy>=0.10",  # robots.txt; stdlib robotparser mishandles bot-specific groups
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
    "apscheduler>=3.10",
    "openai>=1.40",
    "langdetect>=1.0.9",
    "sqlite-vec>=0.1",
    "qdrant-client>=1.12",
    "numpy>=2.0",
    "anyio>=4.4",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
