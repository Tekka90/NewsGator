# Default values for newsgator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @section -- application configuration
# Every value maps to an environment variable of the NewsGator backend
# (see docker/.env.example). Non-sensitive values go to a ConfigMap,
# credentials and tokens go to a Secret. Values set here are env-locked
# in the admin Settings GUI (env var > DB override > code default).
config:
  # -- SQLAlchemy async database URL. Stored in the Secret because it may embed credentials. The default points at the persistent volume mounted at /data.
  databaseUrl: "sqlite+aiosqlite:////data/newsgator.db"

  # -- Session-cookie signing secret. When left empty, a random 64-character key is generated on first install and reused on upgrades. Stored in the Secret.
  # @default -- "" (auto-generated)
  secretKey: ""

  # @subsection -- LLM (external OpenAI-compatible server: oMLX, Ollama, llama.cpp, LM Studio...)
  # Defaults target OpenRouter so the chart works out-of-the-box without a local LLM:
  # set llm.apiKey to your OpenRouter key (https://openrouter.ai/keys) and the
  # pipeline is fully functional. Free models are used by default; the embedding
  # model MUST stay 1024-dimensional (sqlite-vec tables are created for 1024).
  llm:
    # -- Base URL of the external OpenAI-compatible LLM server
    baseUrl: "https://openrouter.ai/api/v1"
    # baseUrl: "http://localhost:8080/v1"
    # -- Chat model name served by the LLM server
    model: "meta-llama/llama-3.3-70b-instruct"
    # -- Bearer token sent to the LLM server. OpenRouter requires a real API key; local servers usually ignore it. Stored in the Secret.
    apiKey: ""
    # -- Embeddings endpoint. Empty = defaults to llm.baseUrl.
    embedBaseUrl: ""
    # -- Embeddings model (must output 1024 dimensions)
    embedModel: "baai/bge-m3"
    # -- Model context window in tokens; longer articles are condensed map-reduce style
    contextTokens: 32768
    # -- LLM request timeout in seconds (long articles on slow models need headroom)
    timeoutS: 120
    # -- Feed discovery time budget in seconds; partial results are returned after it
    discoveryBudgetS: 40
    # Live LLM interaction trace on the Activity page (prompts/replies, in-memory only - never stored in the DB)
    trace:
      # -- Enable the live LLM interaction trace
      enabled: true
      # -- Per-message clamp; longer text is truncated
      maxChars: 8000

  # @subsection -- Language and story text length
  language:
    # -- Language all summaries/embeddings are produced in (ISO 639-1)
    summary: "en"
    # -- Story summary length guidance, merge + headline prompts only (1-12, must be <= summaryMaxSentences)
    summaryMinSentences: 3
    # -- Story summary length guidance, merge + headline prompts only (1-12)
    summaryMaxSentences: 5
    # -- Headline length guidance (0 = no minimum in the prompt, max 40)
    headlineMinWords: 0
    # -- Headline length guidance (1-40, must be >= headlineMinWords)
    headlineMaxWords: 12

  # @subsection -- Vector store
  vectorStore:
    # -- Vector backend: sqlite_vec (default, zero-ops) or qdrant (external server - never spun up by this chart)
    # @schema
    # enum: [sqlite_vec, qdrant]
    # @schema
    backend: "sqlite_vec"
    # External Qdrant server (only used when backend=qdrant)
    qdrant:
      # -- Qdrant base URL. Empty = unset.
      url: ""
      # -- Qdrant API key. Stored in the Secret, only rendered when set.
      apiKey: ""

  # @subsection -- Clustering thresholds (tune later via the Settings feedback report)
  clustering:
    # -- Cosine-similarity threshold to attach an article to an existing story
    tauAttach: 0.82
    # -- Lower bound of the gray zone triggering a pairwise LLM decision
    tauGray: 0.70
    # -- Hours after which a story is frozen and no longer accepts new sources
    freezeAfterHours: 72

  # @subsection -- Ingestion pipeline
  ingestion:
    # -- Days articles/stories are retained before the nightly purge
    retentionDays: 45
    # -- Disable a feed after this many days of consecutive failures
    feedDisableAfterDays: 7
    # -- Minimum feed poll interval in minutes
    pollIntervalMinMinutes: 15
    # -- Maximum feed poll interval in minutes
    pollIntervalMaxMinutes: 60
    # -- Below this extracted-text length the archive.is fallback is tried
    fulltextMinChars: 400
    # -- How often articles stuck mid-pipeline (LLM errors, restarts) are retried
    backlogSweepMinutes: 30
    # -- Timeout in minutes for processing a single article through all stages
    articleProcessTimeoutMinutes: 15

  # @subsection -- Newsletter ingestion (per-user IMAP accounts, set up in the Settings GUI)
  newsletter:
    # -- How often all IMAP accounts are polled
    mailPollMinutes: 15
    # -- Cap per account per poll (oldest first)
    mailMaxMessagesPerPoll: 20
    # -- One LLM call first deletes the non-news chrome (intro, socials, sponsors, platform self-links) from the full email before link extraction
    llmClean: true
    # -- One LLM call per newsletter maps links to their intro text; false = code heuristic only
    llmExtract: true

  # @subsection -- Third-party RSS Reader API ingestion (Google Reader API standard)
  reader:
    # -- How often all connected reader accounts are polled
    pollMinutes: 15

  # @subsection -- Readeck integration (optional self-hosted read-later archive)
  # The "Save to Readeck" action appears on stories only when BOTH baseUrl and token are set.
  readeck:
    # -- Readeck instance base URL. Empty = integration disabled.
    baseUrl: ""
    # -- Readeck API token. Stored in the Secret, only rendered when set.
    token: ""

  # @subsection -- Sharing
  sharing:
    # -- Languages offered by the share button (comma-separated ISO 639-1 codes). Picking one translates the story headline + summary on demand via the LLM; "as is" sharing never calls the LLM.
    languages: "en,fr,de,es,it,pt,nl"

  # @subsection -- Chatbot (RAG question-answering over the story archive)
  chat:
    # -- Enable the /chat endpoint
    enabled: true
    # -- Stories handed to the LLM as grounding
    topK: 12
    # -- ANN candidates re-ranked per question
    candidates: 40

  # @subsection -- Category suggestions
  # The summarize LLM call may propose a new category when none of the current taxonomy fits well; recurring proposals surface to admins, never auto-applied.
  categorySuggestions:
    # -- Enable category-suggestion detection
    enabled: true
    # -- Distinct articles before proposing
    minArticles: 5
    # -- Rolling window for the count
    windowDays: 30

# @section -- Deployment

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: tekka90/newsgator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- backend port
service:
  type: ClusterIP
  port: 8000

# -- frontend port
serviceFrontend:
  type: ClusterIP
  port: 3000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  # @schema
  # additionalProperties: true
  # @schema
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# @schema
# additionalProperties: true
# @schema
# -- resources configuration for the container
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the startup, liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# @schema
# additionalProperties: true
# @schema
livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http-frontend
# @schema
# additionalProperties: true
# @schema
readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http-backend
# @schema
# additionalProperties: true
# @schema
startupProbe:
  enabled: false
  initialDelaySeconds: 30
  failureThreshold: 10
  httpGet:
    path: /api/health
    port: http-backend

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- enable persistence using a PersistentVolumeClaim
persistence:
  enabled: false
  accessModes: ["ReadWriteOnce"]
  size: 1Gi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# @schema
# additionalProperties: true
# @schema
# -- bitnami common dependency values
common: {}
