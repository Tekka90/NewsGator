ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: newsgator.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: newsgator-tls
      hosts:
        - newsgator.local
