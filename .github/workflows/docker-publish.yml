name: Build and publish Docker image

on:
  release:
    types: [published]   # triggers when you publish a GitHub Release
  push:
    branches:
      - main             # optional: also build on every push to main (no push to Hub)

jobs:
  build-and-push:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tekka90/newsgator
          tags: |
            type=semver,pattern={{version}}       # e.g. 1.2.3
            type=semver,pattern={{major}}.{{minor}} # e.g. 1.2
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'release' }}  # only push on releases
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/tekka90/newsgator
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
