name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest + coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Tests with coverage (fails under the threshold in pyproject.toml)
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (svelte-check, tests + coverage gate, i18n, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests with coverage gate
        run: node --test --experimental-test-coverage --test-coverage-lines=90 --test-coverage-functions=85 src/lib/*.test.ts
      - name: Translations complete in all locales
        run: npm run i18n:check
      - name: Build
        run: npm run build
