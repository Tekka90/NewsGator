<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- Armored dorsal scutes on crown -->
    <path d="M28 17 C29 14 35 14 36 17 Z" fill="#24683a"/>
    <path d="M20 19 C22 16 27 16 28 19 Z" fill="#24683a"/>
    <path d="M36 19 C37 16 42 16 44 19 Z" fill="#24683a"/>

    <!-- Gator head base -->
    <path d="M5 38 L5 34 C5 30 10 29 14 29 C15 21 21 21 27 25 C29 26 35 26 37 25 C43 21 49 21 50 29 C54 29 59 30 59 34 L59 38 Z" fill="#389d5a"/>
    
    <!-- Eyes - attentive golden alligator eyes with slit pupils -->
    <ellipse cx="22" cy="27" rx="3.6" ry="4" fill="#fbbf24"/>
    <ellipse cx="42" cy="27" rx="3.6" ry="4" fill="#fbbf24"/>
    <!-- Vertical slit pupils with pointed ends -->
    <path d="M22 23.5 Q23.3 27 22 30.5 Q20.7 27 22 23.5 Z" fill="#052e16"/>
    <path d="M42 23.5 Q43.3 27 42 30.5 Q40.7 27 42 23.5 Z" fill="#052e16"/>
    <!-- Specular highlight -->
    <circle cx="23.2" cy="25.5" r="0.8" fill="#fefce8"/>
    <circle cx="43.2" cy="25.5" r="0.8" fill="#fefce8"/>
    
    <!-- Reptilian brow ridge contour -->
    <path d="M16 24.5 Q22 21.5 27.5 25" fill="none" stroke="#236037" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M36.5 25 Q42 21.5 48 24.5" fill="none" stroke="#236037" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Broad Alligator U-shaped snout bridge -->
    <path d="M13 38 C13 31.5 20 29.5 32 29.5 C44 29.5 51 31.5 51 38 Z" fill="#44aa64"/>
    <!-- Subtle snout scales / ridge lines -->
    <path d="M25 31.5 Q32 33 39 31.5" fill="none" stroke="#2d7a46" stroke-width="1" stroke-linecap="round"/>

    <!-- Raised bulbous alligator nostril mounds -->
    <ellipse cx="27" cy="35" rx="2.5" ry="1.6" fill="#32884e"/>
    <ellipse cx="37" cy="35" rx="2.5" ry="1.6" fill="#32884e"/>
    <circle cx="27" cy="35" r="1.1" fill="#0d381a"/>
    <circle cx="37" cy="35" r="1.1" fill="#0d381a"/>

    <!-- Newspaper -->
    <rect x="0" y="38" width="64" height="26" fill="#f5f0e1"/>
    <line x1="0" y1="38" x2="64" y2="38" stroke="#dfd6c0" stroke-width="1"/>
    <rect x="7" y="44" width="15" height="13" rx="2" fill="#9fb4a6"/>
    <rect x="26" y="45" width="31" height="4.5" rx="2.25" fill="#14532d"/>
    <rect x="26" y="53" width="31" height="2.6" rx="1.3" fill="#7d8f83"/>
    <rect x="26" y="58.5" width="22" height="2.6" rx="1.3" fill="#7d8f83"/>
    <rect x="7" y="60" width="15" height="2.6" rx="1.3" fill="#7d8f83"/>

    <!-- Sharp white alligator teeth overlapping the newspaper! -->
    <polygon points="15,38 17.5,41.5 20,38" fill="#ffffff" stroke="#ded5be" stroke-width="0.3"/>
    <polygon points="22,38 24.5,41 27,38" fill="#ffffff" stroke="#ded5be" stroke-width="0.3"/>
    <polygon points="37,38 39.5,41 42,38" fill="#ffffff" stroke="#ded5be" stroke-width="0.3"/>
    <polygon points="44,38 46.5,41.5 49,38" fill="#ffffff" stroke="#ded5be" stroke-width="0.3"/>
  </g>
</svg>
