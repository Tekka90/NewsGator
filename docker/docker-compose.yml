services:
  newsgator:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # GUI
      - "8000:8000"   # API (optional exposure; GUI proxies /api)
    volumes:
      - newsgator-data:/data
    # Load every variable from docker/.env into the container — no per-variable
    # plumbing in this file, so optional settings (Qdrant, thresholds, retention…)
    # just work when you add them to .env. Container-internal values below are
    # fixed and must NOT come from .env (they point inside the container).
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/newsgator.db
      NEWSGATOR_BACKEND_DIR: /app
    restart: unless-stopped

volumes:
  newsgator-data:
